<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Our Story — Begin</title>
<meta name="description" content="Someone has prepared a special surprise just for you.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="loader" class="loader">
  <div class="loader-pulse"></div>
  <p class="loader-text">setting the scene</p>
</div>

<div class="curtain" id="curtain"></div>

<div class="ambience" aria-hidden="true">
  <div id="aurora-layer" class="ambience-layer"></div>
  <div id="stars-layer" class="ambience-layer"></div>
  <div id="hearts-layer" class="ambience-layer"></div>
</div>
<canvas id="confetti-canvas" aria-hidden="true"></canvas>
<canvas id="fireworks-canvas" aria-hidden="true"></canvas>
<canvas id="click-canvas" aria-hidden="true"></canvas>

<!-- 🎵 REPLACE with your own opening/ambient track -->
<audio id="bgAudio" loop preload="none"><source src="assets/music/opening-theme.mp3" type="audio/mpeg"></audio>
<button id="musicToggle" class="music-toggle" aria-label="Play or pause music">
  <span class="bars"><span></span><span></span><span></span><span></span></span>
</button>

<nav class="story-progress" aria-label="Story progress">
  <span class="bud" data-page="index.html"></span>
  <span class="bud" data-page="birthday.html"></span>
  <span class="bud" data-page="memories.html"></span>
  <span class="bud" data-page="letter.html"></span>
  <span class="bud" data-page="reasons.html"></span>
  <span class="bud" data-page="proposal.html"></span>
  <span class="bud" data-page="final.html"></span>
</nav>

<!-- ============================================================
     PAGE 1 — WELCOME
     Tip: click anywhere on the page for a little spark burst.
============================================================= -->
<main class="page welcome-page">
  <div class="welcome-content">
    <p class="eyebrow">someone has something to show you</p>
    <p class="welcome-lead">Someone has prepared a special surprise, just for you.</p>
    <!-- 💌 REPLACE with their name if you'd like it personalized -->
    <h1 class="neon-heading welcome-title">Our <span class="glow">Story</span></h1>

    <a href="birthday.html" id="openSurpriseBtn" class="neon-btn page-link">Open My Surprise ❤️</a>
    <p class="welcome-hint">tip — try clicking anywhere ✦</p>
  </div>
</main>

<script src="script.js"></script>
</body>
</html>
