<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Our Story — My Heart Speaks</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="loader" class="loader"><div class="loader-pulse"></div><p class="loader-text">finding the right words</p></div>
<div class="curtain" id="curtain"></div>

<div class="ambience" aria-hidden="true"><div id="hearts-layer" class="ambience-layer"></div></div>
<canvas id="click-canvas" aria-hidden="true"></canvas>

<!-- 🎵 REPLACE with a gentle, emotional instrumental track -->
<audio id="bgAudio" loop preload="none"><source src="assets/music/love-letter.mp3" type="audio/mpeg"></audio>
<button id="musicToggle" class="music-toggle" aria-label="Play or pause music">
  <span class="bars"><span></span><span></span><span></span><span></span></span>
</button>

<nav class="story-progress" aria-label="Story progress">
  <span class="bud" data-page="index.html"></span>
  <span class="bud" data-page="birthday.html"></span>
  <span class="bud" data-page="memories.html"></span>
  <span class="bud" data-page="letter.html"></span>
  <span class="bud" data-page="reasons.html"></span>
  <span class="bud" data-page="proposal.html"></span>
  <span class="bud" data-page="final.html"></span>
</nav>

<!-- ============================================================
     PAGE 4 — MY HEART SPEAKS (love letter)
============================================================= -->
<main class="page letter-page">
  <div class="page-inner">
    <p class="eyebrow reveal">a letter for you</p>
    <h2 class="neon-heading reveal">My Heart <span class="glow">Speaks</span></h2>

    <div class="paper-wrap">
      <div class="paper" id="paper">
        <div class="letter-paper">
          <!-- ✍️ Edit CONFIG.loveLetter in script.js -->
          <p class="letter-text" id="letterText"></p>
          <p class="letter-signoff">— always yours</p>
        </div>
      </div>
    </div>

    <a href="reasons.html" class="neon-btn page-link reveal" style="margin-top:34px;">Keep Reading</a>
  </div>
</main>

<script>
  window.addEventListener("load", () => {
    const a = document.getElementById("bgAudio");
    const t = document.getElementById("musicToggle");
    if (a) a.play().then(() => t && t.classList.add("playing")).catch(() => {});
  });
</script>
<script src="script.js"></script>
</body>
</html>
