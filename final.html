<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Our Story — Forever</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="loader" class="loader"><div class="loader-pulse"></div><p class="loader-text">forever begins here</p></div>
<div class="curtain" id="curtain"></div>

<div class="ambience" aria-hidden="true"><div id="hearts-layer" class="ambience-layer"></div></div>
<canvas id="confetti-canvas" aria-hidden="true"></canvas>
<canvas id="fireworks-canvas" aria-hidden="true"></canvas>
<canvas id="click-canvas" aria-hidden="true"></canvas>

<!-- 🎵 REPLACE with a soft closing track -->
<audio id="bgAudio" loop preload="none"><source src="assets/music/forever.mp3" type="audio/mpeg"></audio>
<button id="musicToggle" class="music-toggle" aria-label="Play or pause music">
  <span class="bars"><span></span><span></span><span></span><span></span></span>
</button>

<nav class="story-progress" aria-label="Story progress">
  <span class="bud" data-page="index.html"></span>
  <span class="bud" data-page="birthday.html"></span>
  <span class="bud" data-page="memories.html"></span>
  <span class="bud" data-page="letter.html"></span>
  <span class="bud" data-page="reasons.html"></span>
  <span class="bud" data-page="proposal.html"></span>
  <span class="bud" data-page="final.html"></span>
</nav>

<!-- ============================================================
     FINAL PAGE
============================================================= -->
<main class="page final-page">
  <div class="page-inner">
    <p class="eyebrow reveal">and so it begins</p>
    <h2 class="neon-heading reveal">Our story starts with honesty,<br>respect, and <span class="glow">happiness</span>.</h2>

    <!-- 📸 Replace the placeholder below with <img src="assets/images/us.jpg" alt="Us"> -->
    <figure class="final-frame reveal">
      <div class="frame-photo">💞</div>
      <figcaption>Forever With You</figcaption>
    </figure>

    <div class="final-actions reveal">
      <button id="shareBtn" class="neon-btn">Share Our Story</button>
      <button id="downloadBtn" class="ghost-neon-btn">Download Memory Card</button>
    </div>

    <p class="final-note reveal">Here's to us.</p>
  </div>
</main>

<script src="script.js"></script>
<script>
  window.addEventListener("load", () => {
    setTimeout(() => { if (typeof fireConfetti === "function") fireConfetti(2500, 100); }, 500);
  });
</script>
</body>
</html>
