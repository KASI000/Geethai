<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Our Story — Reasons</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="loader" class="loader"><div class="loader-pulse"></div><p class="loader-text">counting the reasons</p></div>
<div class="curtain" id="curtain"></div>

<div class="ambience" aria-hidden="true"><div id="hearts-layer" class="ambience-layer"></div></div>
<canvas id="confetti-canvas" aria-hidden="true"></canvas>
<canvas id="click-canvas" aria-hidden="true"></canvas>

<!-- 🎵 REPLACE with a warm, upbeat-but-soft track -->
<audio id="bgAudio" loop preload="none"><source src="assets/music/reasons.mp3" type="audio/mpeg"></audio>
<button id="musicToggle" class="music-toggle" aria-label="Play or pause music">
  <span class="bars"><span></span><span></span><span></span><span></span></span>
</button>

<nav class="story-progress" aria-label="Story progress">
  <span class="bud" data-page="index.html"></span>
  <span class="bud" data-page="birthday.html"></span>
  <span class="bud" data-page="memories.html"></span>
  <span class="bud" data-page="letter.html"></span>
  <span class="bud" data-page="reasons.html"></span>
  <span class="bud" data-page="proposal.html"></span>
  <span class="bud" data-page="final.html"></span>
</nav>

<!-- ============================================================
     PAGE 5 — REASONS + INTERACTIVE LOVE METER
============================================================= -->
<main class="page reasons-page">
  <div class="page-inner">
    <p class="eyebrow reveal">just a few reasons</p>
    <h2 class="neon-heading reveal">Why You're <span class="glow">Special</span></h2>
    <p class="section-sub reveal">Drag the heart below — then tilt a card by moving your cursor over it.</p>

    <!-- Draggable "love meter" -->
    <div class="love-meter reveal">
      <div class="love-meter-track" id="loveMeterTrack">
        <div class="love-meter-fill" id="loveMeterFill"></div>
        <div class="love-meter-handle" id="loveMeterHandle">❤</div>
      </div>
      <p class="love-meter-label" id="loveMeterLabel"></p>
    </div>

    <!-- Cards are generated by script.js from CONFIG.reasons, with 3D tilt-on-hover -->
    <div class="reasons-grid" id="reasonsGrid"></div>

    <a href="proposal.html" class="neon-btn page-link reveal" style="margin-top:44px;">One Last Surprise</a>
  </div>
</main>

<script src="script.js"></script>
</body>
</html>
