<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Our Story — Happy Birthday</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="loader" class="loader"><div class="loader-pulse"></div><p class="loader-text">lighting the candles</p></div>
<div class="curtain" id="curtain"></div>

<div class="ambience" aria-hidden="true"><div id="hearts-layer" class="ambience-layer"></div></div>
<canvas id="confetti-canvas" aria-hidden="true"></canvas>
<canvas id="fireworks-canvas" aria-hidden="true"></canvas>
<canvas id="click-canvas" aria-hidden="true"></canvas>
<div class="balloons" id="balloons" aria-hidden="true"></div>
<div class="gifts-layer" id="gifts" aria-hidden="true"></div>

<!-- 🎵 REPLACE with your own "Happy Birthday" style track -->
<audio id="bgAudio" loop preload="none"><source src="assets/music/happy-birthday.mp3" type="audio/mpeg"></audio>
<button id="musicToggle" class="music-toggle" aria-label="Play or pause music">
  <span class="bars"><span></span><span></span><span></span><span></span></span>
</button>

<nav class="story-progress" aria-label="Story progress">
  <span class="bud" data-page="index.html"></span>
  <span class="bud" data-page="birthday.html"></span>
  <span class="bud" data-page="memories.html"></span>
  <span class="bud" data-page="letter.html"></span>
  <span class="bud" data-page="reasons.html"></span>
  <span class="bud" data-page="proposal.html"></span>
  <span class="bud" data-page="final.html"></span>
</nav>

<!-- ============================================================
     PAGE 2 — BIRTHDAY CELEBRATION
============================================================= -->
<main class="page birthday-page">
  <div class="page-inner">
    <p class="eyebrow reveal">happy birthday</p>

    <div class="cake-wrap reveal" id="cakeWrap">
      <svg viewBox="0 0 220 200" class="cake-svg">
        <g class="candles">
          <rect x="60" y="20" width="6" height="26" rx="3" fill="#F6D3A3"/>
          <rect x="107" y="12" width="6" height="34" rx="3" fill="#F6D3A3"/>
          <rect x="154" y="20" width="6" height="26" rx="3" fill="#F6D3A3"/>
          <ellipse class="flame" cx="63" cy="16" rx="5" ry="9" fill="#FFD27A"/>
          <ellipse class="flame" cx="110" cy="8" rx="5" ry="9" fill="#FFD27A"/>
          <ellipse class="flame" cx="157" cy="16" rx="5" ry="9" fill="#FFD27A"/>
        </g>
        <rect x="30" y="50" width="160" height="40" rx="6" fill="url(#tierTop)"/>
        <rect x="15" y="90" width="190" height="55" rx="8" fill="url(#tierBottom)"/>
        <rect x="10" y="145" width="200" height="18" rx="4" fill="#1b2044"/>
        <path d="M30 55 q10 -14 20 0 q10 -14 20 0 q10 -14 20 0 q10 -14 20 0 q10 -14 20 0 q10 -14 20 0 v10 H30 Z" fill="#f5f3ff"/>
        <defs>
          <linearGradient id="tierTop" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#ff2d95"/><stop offset="100%" stop-color="#8b3bff"/></linearGradient>
          <linearGradient id="tierBottom" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#21e6c1"/><stop offset="100%" stop-color="#3b6bff"/></linearGradient>
        </defs>
      </svg>
    </div>

    <h1 class="neon-heading happy-birthday-text" id="happyBirthdayText">Happy Birthday</h1>

    <!-- ✏️ REPLACE this name -->
    <p class="section-sub reveal">to my favorite person</p>

    <!-- ✏️ Edit CONFIG.birthdayMessage in script.js -->
    <p class="birthday-message reveal" id="birthdayMessage"></p>

    <a href="memories.html" class="neon-btn page-link reveal">Continue →</a>
  </div>
</main>

<script src="script.js"></script>
</body>
</html>
